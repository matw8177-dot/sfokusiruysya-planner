<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Сфокусируйся">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <title>Сфокусируйся — учебный планировщик</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --surface: #181a1f;
      --surface-2: #202229;
      --line: rgba(255,255,255,.08);
      --text: #f2f1ed;
      --muted: #92949e;
      --lime: #c7f36b;
      --lime-dark: #a6d448;
      --coral: #ff806e;
      --lavender: #b6a5ff;
      --radius: 22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(ellipse at 50% -15%, rgba(113,132,66,.13), transparent 42%), var(--bg);
      font-size: 15px; line-height: 1.5;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1100px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 56px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:27px; }
    .brand { display:flex; align-items:center; gap:11px; font-weight:750; letter-spacing:-.04em; font-size:18px; }
    .brand-mark { width:33px; height:33px; border-radius:11px; display:grid; place-items:center; background:var(--lime); color:#16190e; font-size:18px; }
    .today-pill { color:var(--muted); font-size:13px; background:rgba(255,255,255,.035); border:1px solid var(--line); border-radius:99px; padding:8px 13px; }
    .deadline {
      position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:26px;
      padding:25px 29px; margin-bottom:24px; border:1px solid rgba(199,243,107,.16); border-radius:var(--radius);
      background:linear-gradient(115deg, rgba(199,243,107,.075), rgba(199,243,107,.018) 58%, rgba(255,255,255,.02));
    }
    .deadline::after { content:""; position:absolute; width:210px; height:210px; border:1px solid rgba(199,243,107,.1); border-radius:50%; right:24%; top:-160px; box-shadow:0 0 0 24px rgba(199,243,107,.025),0 0 0 49px rgba(199,243,107,.018); pointer-events:none; }
    .eyebrow { color:var(--muted); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.13em; }
    .deadline-head { display:flex; align-items:center; gap:9px; margin-bottom:8px; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 12px rgba(199,243,107,.55); }
    .event-title { width:min(430px,100%); color:var(--text); padding:0; border:0; outline:0; background:transparent; font-size:21px; font-weight:700; letter-spacing:-.035em; }
    .event-title::placeholder { color:#777982; }
    .deadline-controls { display:flex; align-items:center; gap:10px; margin-top:12px; }
    .deadline-controls label { color:var(--muted); font-size:12px; }
    input[type=date] { color:var(--text); background:rgba(0,0,0,.2); border:1px solid var(--line); border-radius:10px; padding:7px 9px; }
    .countdown { display:flex; align-items:center; gap:8px; position:relative; z-index:1; }
    .time-unit { min-width:61px; text-align:center; }
    .time-unit strong { display:block; font-size:30px; line-height:1.1; letter-spacing:-.055em; font-variant-numeric:tabular-nums; }
    .time-unit span { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.12em; }
    .time-sep { color:#64676e; padding-bottom:13px; }
    .layout { display:grid; grid-template-columns:minmax(0,1.04fr) minmax(330px,.96fr); gap:24px; align-items:start; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
    .focus-card { padding:25px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .section-title { margin:0; font-size:18px; letter-spacing:-.035em; font-weight:700; }
    .session-count { color:var(--muted); font-size:12px; background:var(--surface-2); border-radius:99px; padding:6px 10px; white-space:nowrap; }
    .focus-task { margin-top:17px; padding:13px 15px; min-height:67px; display:flex; align-items:center; gap:12px; background:rgba(199,243,107,.065); border:1px solid rgba(199,243,107,.16); border-radius:15px; }
    .focus-icon { width:31px; height:31px; display:grid; place-items:center; flex:none; color:#1a1d11; background:var(--lime); border-radius:10px; }
    .focus-copy { min-width:0; flex:1; }
    .focus-copy .eyebrow { color:var(--lime); font-size:9px; }
    .focus-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; font-weight:700; margin-top:2px; }
    .clear-focus { cursor:pointer; background:transparent; border:0; color:var(--muted); font-size:18px; padding:5px; }
    .timer-wrap { display:grid; justify-items:center; padding:27px 0 17px; }
    .modes { display:flex; gap:5px; padding:4px; background:#111216; border:1px solid var(--line); border-radius:12px; }
    .mode-btn { border:0; border-radius:9px; padding:8px 13px; color:var(--muted); background:transparent; cursor:pointer; font-size:12px; transition:.2s ease; }
    .mode-btn.active { color:var(--text); background:#2a2c32; }
    .clock { --progress:100%; width:222px; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; position:relative; margin:23px 0 17px; background:conic-gradient(var(--lime) var(--progress), rgba(255,255,255,.075) 0); transition:background .25s linear; }
    .clock::before { content:""; position:absolute; inset:7px; border-radius:50%; background:var(--surface); box-shadow:inset 0 0 0 1px rgba(255,255,255,.025); }
    .clock-inner { position:relative; text-align:center; }
    .timer-time { display:block; font-size:55px; letter-spacing:-.075em; font-weight:670; line-height:1; font-variant-numeric:tabular-nums; }
    .timer-caption { display:block; margin-top:9px; color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    .timer-actions { display:flex; justify-content:center; gap:9px; }
    .btn { cursor:pointer; border:1px solid var(--line); background:var(--surface-2); padding:11px 18px; border-radius:12px; font-weight:650; font-size:13px; transition:transform .15s, background .15s, border-color .15s; }
    .btn:hover { transform:translateY(-1px); background:#2a2d34; }
    .btn:active { transform:scale(.98); }
    .btn-primary { color:#1a1d11; background:var(--lime); border-color:var(--lime); min-width:106px; }
    .btn-primary:hover { background:var(--lime-dark); border-color:var(--lime-dark); }
    .timer-note { color:var(--muted); font-size:11px; margin-top:15px; }
    .tasks-card { padding:23px; }
    .task-count { color:var(--muted); font-size:12px; }
    .task-form { display:grid; grid-template-columns:minmax(0,1fr) 125px auto; gap:8px; margin-top:17px; }
    .field { min-width:0; color:var(--text); background:#111216; border:1px solid var(--line); border-radius:11px; padding:10px 11px; outline:none; transition:border-color .2s; }
    .field:focus { border-color:rgba(199,243,107,.5); }
    .field::placeholder { color:#6d7079; }
    select.field { cursor:pointer; }
    .add-btn { cursor:pointer; display:grid; place-items:center; border:0; border-radius:11px; background:var(--lime); color:#17190f; width:42px; font-size:21px; font-weight:500; transition:transform .15s,background .15s; }
    .add-btn:hover { background:var(--lime-dark); transform:translateY(-1px); }
    .urgent-toggle { display:flex; align-items:center; gap:7px; color:var(--muted); cursor:pointer; font-size:12px; margin-top:11px; width:max-content; user-select:none; }
    .urgent-toggle input { accent-color:var(--coral); width:14px; height:14px; margin:0; }
    .task-list { display:grid; gap:8px; padding:0; margin:17px 0 0; list-style:none; max-height:450px; overflow:auto; }
    .task-item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.018); transition:border-color .2s,opacity .2s; }
    .task-item:hover { border-color:rgba(255,255,255,.14); }
    .task-item.done { opacity:.53; }
    .check { appearance:none; width:18px; height:18px; border:1px solid #50525c; border-radius:6px; cursor:pointer; margin:0; display:grid; place-items:center; }
    .check:checked { background:var(--lime); border-color:var(--lime); }
    .check:checked::after { content:"✓"; color:#191c11; font-size:12px; font-weight:800; }
    .task-copy { min-width:0; }
    .task-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:13px; }
    .done .task-name { text-decoration:line-through; }
    .task-meta { display:flex; align-items:center; gap:7px; margin-top:4px; }
    .tag { color:var(--lavender); background:rgba(182,165,255,.1); border-radius:6px; padding:2px 6px; font-size:10px; }
    .urgent { color:var(--coral); font-size:10px; font-weight:650; }
    .task-actions { display:flex; align-items:center; gap:5px; }
    .focus-task-btn { cursor:pointer; color:var(--lime); border:1px solid rgba(199,243,107,.22); background:rgba(199,243,107,.06); border-radius:9px; padding:7px 9px; font-size:10px; font-weight:700; white-space:nowrap; transition:background .2s; }
    .focus-task-btn:hover { background:rgba(199,243,107,.14); }
    .delete-btn { cursor:pointer; border:0; background:transparent; color:#777a83; font-size:17px; padding:4px; line-height:1; }
    .delete-btn:hover { color:var(--coral); }
    .empty-state { color:var(--muted); text-align:center; padding:29px 12px; font-size:13px; border:1px dashed rgba(255,255,255,.09); border-radius:14px; }
    .footnote { display:flex; justify-content:center; gap:7px; align-items:center; margin-top:17px; color:#747780; font-size:11px; }
    .footnote span { color:var(--lime); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:760px) {
      .shell { width:min(100% - 28px,560px); padding:20px 0 36px; }
      .topbar { margin-bottom:18px; }
      .deadline { grid-template-columns:1fr; gap:19px; padding:20px; }
      .countdown { justify-content:flex-start; }
      .time-unit { min-width:54px; }
      .time-unit strong { font-size:26px; }
      .layout { grid-template-columns:1fr; gap:15px; }
      .focus-card,.tasks-card { padding:20px; }
      .clock { width:205px; }
      .timer-time { font-size:51px; }
    }
    @media (max-width:390px) {
      .today-pill { font-size:11px; padding:7px 9px; }
      .event-title { font-size:18px; }
      .deadline-controls { flex-wrap:wrap; }
      .time-unit { min-width:46px; }
      .time-unit strong { font-size:23px; }
      .task-form { grid-template-columns:minmax(0,1fr) auto; }
      .task-form .field:first-child { grid-column:1 / -1; }
      .task-form select { grid-column:1; }
      .task-actions { gap:2px; }
      .focus-task-btn { padding:7px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">✳</div><span>сфокусируйся</span></div>
      <div class="today-pill" id="todayLabel"></div>
    </header>

    <section class="deadline" aria-labelledby="deadlineHeading">
      <div>
        <div class="deadline-head"><span class="live-dot" aria-hidden="true"></span><span class="eyebrow" id="deadlineHeading">Твой главный дедлайн</span></div>
        <label class="sr-only" for="eventName">Название события</label>
        <input class="event-title" id="eventName" maxlength="70" placeholder="Например, экзамен по физике">
        <div class="deadline-controls"><label for="eventDate">Дата события</label><input id="eventDate" type="date"></div>
      </div>
      <div class="countdown" aria-label="Осталось до дедлайна">
        <div class="time-unit"><strong id="daysLeft">00</strong><span>дней</span></div><span class="time-sep">:</span>
        <div class="time-unit"><strong id="hoursLeft">00</strong><span>часов</span></div><span class="time-sep">:</span>
        <div class="time-unit"><strong id="minutesLeft">00</strong><span>минут</span></div><span class="time-sep">:</span>
        <div class="time-unit"><strong id="secondsLeft">00</strong><span>секунд</span></div>
      </div>
    </section>

    <div class="layout">
      <section class="card focus-card" aria-labelledby="timerHeading">
        <div class="section-head"><h1 class="section-title" id="timerHeading">Время для фокуса</h1><div class="session-count">Сегодня: <strong id="sessionCount">0</strong> сессий</div></div>
        <div class="focus-task" id="focusTask" hidden>
          <div class="focus-icon" aria-hidden="true">◎</div><div class="focus-copy"><div class="eyebrow">Сейчас в фокусе</div><div class="focus-name" id="focusName"></div></div>
          <button class="clear-focus" id="clearFocus" type="button" aria-label="Снять задачу с фокуса">×</button>
        </div>
        <div class="timer-wrap">
          <div class="modes" role="group" aria-label="Режим таймера">
            <button class="mode-btn active" type="button" data-mode="study" aria-pressed="true">Учеба · 25 мин</button>
            <button class="mode-btn" type="button" data-mode="break" aria-pressed="false">Отдых · 5 мин</button>
          </div>
          <div class="clock" id="clockRing" role="timer" aria-label="25 минут 00 секунд">
            <div class="clock-inner"><span class="timer-time" id="timerDisplay">25:00</span><span class="timer-caption" id="timerCaption">Время учиться</span></div>
          </div>
          <div class="timer-actions">
            <button class="btn btn-primary" type="button" id="startPause">Старт</button>
            <button class="btn" type="button" id="resetTimer">Сброс</button>
          </div>
          <div class="timer-note" id="timerNote">Один шаг за раз — у тебя получится.</div>
        </div>
      </section>

      <section class="card tasks-card" aria-labelledby="tasksHeading">
        <div class="section-head"><h2 class="section-title" id="tasksHeading">Учебные задачи</h2><span class="task-count" id="taskCount">0 задач</span></div>
        <form class="task-form" id="taskForm">
          <label class="sr-only" for="taskInput">Новая задача</label><input class="field" id="taskInput" maxlength="120" placeholder="Что нужно сделать?" autocomplete="off" required>
          <label class="sr-only" for="taskSubject">Предмет</label><select class="field" id="taskSubject"><option>Математика</option><option>Русский</option><option>Физика</option><option>Проект</option></select>
          <button class="add-btn" type="submit" aria-label="Добавить задачу">+</button>
        </form>
        <label class="urgent-toggle"><input type="checkbox" id="urgentInput"> Отметить как срочную</label>
        <ul class="task-list" id="taskList"></ul>
        <div class="footnote"><span>✦</span> Маленький прогресс — тоже прогресс</div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'sfokusiruysya-planner-v1';
      const MODES = { study: 25 * 60, break: 5 * 60 };
      const $ = (selector) => document.querySelector(selector);
      const todayKey = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      };
      const defaultDeadline = () => {
        const d = new Date(); d.setDate(d.getDate() + 14);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      };
      let state = { eventName:'Подготовка к важному дню', eventDate:defaultDeadline(), tasks:[], focusId:null, sessionDay:todayKey(), sessions:0 };
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && typeof saved === 'object') state = { ...state, ...saved, tasks:Array.isArray(saved.tasks) ? saved.tasks : [] };
      } catch (error) { console.warn('Не удалось прочитать сохранённые данные.', error); }
      if (state.sessionDay !== todayKey()) { state.sessionDay = todayKey(); state.sessions = 0; }
      const persist = () => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch (error) { console.warn('Не удалось сохранить данные в браузере.', error); }
      };
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const eventName = $('#eventName'), eventDate = $('#eventDate');
      eventName.value = state.eventName || ''; eventDate.value = state.eventDate || defaultDeadline();
      $('#todayLabel').textContent = new Intl.DateTimeFormat('ru-RU', { weekday:'long', day:'numeric', month:'long' }).format(new Date());
      eventName.addEventListener('input', () => { state.eventName = eventName.value; persist(); });
      eventDate.addEventListener('change', () => { state.eventDate = eventDate.value || defaultDeadline(); persist(); updateCountdown(); });

      function updateCountdown() {
        const date = eventDate.value ? new Date(`${eventDate.value}T23:59:59`) : null;
        const remaining = date ? Math.max(0, date.getTime() - Date.now()) : 0;
        const seconds = Math.floor(remaining / 1000);
        $('#daysLeft').textContent = String(Math.floor(seconds / 86400)).padStart(2,'0');
        $('#hoursLeft').textContent = String(Math.floor(seconds % 86400 / 3600)).padStart(2,'0');
        $('#minutesLeft').textContent = String(Math.floor(seconds % 3600 / 60)).padStart(2,'0');
        $('#secondsLeft').textContent = String(seconds % 60).padStart(2,'0');
      }
      updateCountdown(); setInterval(updateCountdown, 1000);

      function renderTasks() {
        const list = $('#taskList');
        const sorted = [...state.tasks].sort((a,b) => Number(a.done)-Number(b.done) || Number(b.urgent)-Number(a.urgent) || b.created-a.created);
        $('#taskCount').textContent = `${state.tasks.length} ${state.tasks.length === 1 ? 'задача' : state.tasks.length >= 2 && state.tasks.length <= 4 ? 'задачи' : 'задач'}`;
        if (!sorted.length) { list.innerHTML = '<li class="empty-state">Пока список пуст. Добавь первую задачу и начни с малого.</li>'; return; }
        list.innerHTML = sorted.map(task => `<li class="task-item ${task.done ? 'done' : ''}" data-id="${escapeHtml(task.id)}">
          <input class="check" type="checkbox" aria-label="Отметить выполненной" ${task.done ? 'checked' : ''}>
          <div class="task-copy"><div class="task-name">${escapeHtml(task.name)}</div><div class="task-meta"><span class="tag">${escapeHtml(task.subject)}</span>${task.urgent ? '<span class="urgent">● Срочно</span>' : ''}</div></div>
          <div class="task-actions"><button class="focus-task-btn" type="button">Взять в фокус</button><button class="delete-btn" type="button" aria-label="Удалить задачу">×</button></div>
        </li>`).join('');
        list.querySelectorAll('.task-item').forEach(row => {
          const task = state.tasks.find(item => item.id === row.dataset.id);
          row.querySelector('.check').addEventListener('change', (event) => { task.done = event.target.checked; if (task.done && state.focusId === task.id) state.focusId = null; persist(); renderTasks(); renderFocus(); });
          row.querySelector('.focus-task-btn').addEventListener('click', () => { state.focusId = task.id; persist(); renderFocus(); $('#timerHeading').scrollIntoView({ behavior:'smooth', block:'center' }); });
          row.querySelector('.delete-btn').addEventListener('click', () => { state.tasks = state.tasks.filter(item => item.id !== task.id); if (state.focusId === task.id) state.focusId = null; persist(); renderTasks(); renderFocus(); });
        });
      }
      function renderFocus() {
        const task = state.tasks.find(item => item.id === state.focusId && !item.done);
        $('#focusTask').hidden = !task;
        if (task) $('#focusName').textContent = task.name;
      }
      $('#clearFocus').addEventListener('click', () => { state.focusId = null; persist(); renderFocus(); });
      $('#taskForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const input = $('#taskInput'), name = input.value.trim(); if (!name) return;
        state.tasks.push({ id: (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`, name, subject:$('#taskSubject').value, urgent:$('#urgentInput').checked, done:false, created:Date.now() });
        input.value = ''; $('#urgentInput').checked = false; persist(); renderTasks(); input.focus();
      });
      renderTasks(); renderFocus();

      let mode = 'study', remaining = MODES.study, interval = null, endsAt = null, audioContext = null;
      const display = $('#timerDisplay'), ring = $('#clockRing'), startPause = $('#startPause');
      function paintTimer() {
        const mins = Math.floor(remaining / 60), secs = remaining % 60;
        display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        const progress = Math.max(0, Math.min(100, remaining / MODES[mode] * 100));
        ring.style.setProperty('--progress', `${progress}%`);
        ring.setAttribute('aria-label', `${mins} минут ${secs} секунд`);
        document.title = `${display.textContent} · ${mode === 'study' ? 'Фокус' : 'Отдых'}`;
      }
      function soundComplete() {
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
          const now = audioContext.currentTime;
          [660, 880, 990].forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator(), gain = audioContext.createGain();
            oscillator.type = 'sine'; oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(.0001, now + index * .18);
            gain.gain.exponentialRampToValueAtTime(.13, now + index * .18 + .025);
            gain.gain.exponentialRampToValueAtTime(.0001, now + index * .18 + .42);
            oscillator.connect(gain); gain.connect(audioContext.destination);
            oscillator.start(now + index * .18); oscillator.stop(now + index * .18 + .44);
          });
        } catch (error) { console.warn('Звуковой сигнал недоступен в этом браузере.', error); }
      }
      function finishTimer() {
        clearInterval(interval); interval = null; endsAt = null; remaining = 0; paintTimer(); soundComplete();
        $('#timerNote').textContent = mode === 'study' ? 'Сессия завершена — время немного отдохнуть.' : 'Отдых окончен — можно возвращаться к учебе.';
        if (mode === 'study') { if (state.sessionDay !== todayKey()) { state.sessionDay = todayKey(); state.sessions = 0; } state.sessions += 1; $('#sessionCount').textContent = state.sessions; persist(); }
        startPause.textContent = 'Старт'; startPause.setAttribute('aria-label','Начать таймер');
      }
      startPause.addEventListener('click', () => {
        if (interval) {
          remaining = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
          clearInterval(interval); interval = null; endsAt = null;
          if (remaining <= 0) { finishTimer(); return; }
          paintTimer(); startPause.textContent = 'Продолжить'; $('#timerNote').textContent = 'Пауза — нажми, когда будешь готов(а).'; return;
        }
        if (remaining <= 0) remaining = MODES[mode];
        if (audioContext && audioContext.state === 'suspended') audioContext.resume();
        endsAt = Date.now() + remaining * 1000;
        startPause.textContent = 'Пауза'; $('#timerNote').textContent = mode === 'study' ? 'Ты справишься. Просто продолжай.' : 'Небольшая передышка — часть работы.';
        interval = setInterval(() => {
          remaining = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
          paintTimer(); if (remaining <= 0) finishTimer();
        }, 250);
      });
      $('#resetTimer').addEventListener('click', () => { clearInterval(interval); interval = null; endsAt = null; remaining = MODES[mode]; startPause.textContent = 'Старт'; $('#timerNote').textContent = 'Один шаг за раз — у тебя получится.'; paintTimer(); });
      document.querySelectorAll('.mode-btn').forEach(button => button.addEventListener('click', () => {
        clearInterval(interval); interval = null; endsAt = null; mode = button.dataset.mode; remaining = MODES[mode];
        document.querySelectorAll('.mode-btn').forEach(item => { const active = item === button; item.classList.toggle('active', active); item.setAttribute('aria-pressed', String(active)); });
        startPause.textContent = 'Старт'; $('#timerCaption').textContent = mode === 'study' ? 'Время учиться' : 'Время выдохнуть'; $('#timerNote').textContent = 'Один шаг за раз — у тебя получится.'; paintTimer();
      }));
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && interval && endsAt) {
          remaining = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
          paintTimer(); if (remaining <= 0) finishTimer();
        }
      });
      $('#sessionCount').textContent = state.sessions || 0; paintTimer();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch((error) => {
          console.warn('Не удалось включить офлайн-режим.', error);
        });
      });
    }
  </script>
</body>
